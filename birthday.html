<!DOCTYPE html>
<html>
<head>
  <title>Birthday Surprise</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: linear-gradient(#ffe6f0, #ffcce0);
      font-family: Arial;
      text-align: center;
    }

    #startBtn {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 15px 30px;
      font-size: 20px;
      background: #ff3366;
      color: white;
      border: none;
      border-radius: 10px;
    }

    #balloon {
      display: none;
      width: 180px;
      height: 230px;
      background: radial-gradient(circle at 30% 30%, #ff4d4d, #cc0000);
      border-radius: 50%;
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation: float 3s infinite ease-in-out;
    }

    @keyframes float {
      0%,100% { transform: translate(-50%, -50%) translateY(0); }
      50% { transform: translate(-50%, -50%) translateY(-15px); }
    }

    #pin {
      display: none;
      width: 35px;
      height: 35px;
      background: silver;
      position: absolute;
      bottom: 60px;
      left: 20px;
      border-radius: 50%;
    }

    #message {
      display: none;
      font-size: 35px;
      color: #ff0066;
      position: absolute;
      top: 40%;
      width: 100%;
    }

    .particle {
      position: absolute;
      font-size: 20px;
      top: 40%;
      left: 50%;
      animation: explode 1.2s ease-out forwards;
    }

    @keyframes explode {
      to {
        transform: translate(var(--x), var(--y));
        opacity: 0;
      }
    }
  </style>
</head>
<body>

<button id="startBtn" onclick="startGame()">Start Surprise </button>

<div id="balloon"></div>
<div id="pin"></div>
<div id="message"> Happy Birthday Anku </div>

<audio id="sound" preload="auto">
  <source src="https://actions.google.com/sounds/v1/explosions/explosion.ogg">
</audio>

<script>
let pin = document.getElementById("pin");
let balloon = document.getElementById("balloon");
let msg = document.getElementById("message");
let sound = document.getElementById("sound");
let startBtn = document.getElementById("startBtn");

let isDragging = false;

function startGame() {
  startBtn.style.display = "none";
  balloon.style.display = "block";
  pin.style.display = "block";

  // unlock sound
  sound.play().then(()=>{
    sound.pause();
    sound.currentTime = 0;
  }).catch(()=>{});
}

pin.addEventListener("touchstart", () => {
  isDragging = true;
});

document.addEventListener("touchmove", (e) => {
  if (!isDragging) return;

  let t = e.touches[0];
  pin.style.left = (t.clientX - 15) + "px";
  pin.style.top = (t.clientY - 15) + "px";

  checkCollision();
});

document.addEventListener("touchend", () => {
  isDragging = false;
});

function checkCollision() {
  let p = pin.getBoundingClientRect();
  let b = balloon.getBoundingClientRect();

  if (!(p.right < b.left || p.left > b.right || p.bottom < b.top || p.top > b.bottom)) {

    // SOUND (now allowed)
    sound.currentTime = 0;
    sound.play().catch(()=>{});

    // VIBRATION
    if (navigator.vibrate) {
      navigator.vibrate([300,100,400]);
    }

    balloon.style.display = "none";

    // particles
    let emojis = ["","","❤️","",""];
    for (let i = 0; i < 30; i++) {
      let el = document.createElement("div");
      el.className = "particle";
      el.innerText = emojis[Math.floor(Math.random()*emojis.length)];
      el.style.setProperty("--x", (Math.random()*300-150) + "px");
      el.style.setProperty("--y", (Math.random()*300-150) + "px");
      document.body.appendChild(el);
      setTimeout(()=>el.remove(),1200);
    }

    msg.style.display = "block";
  }
}
</script>

</body>
</html>
